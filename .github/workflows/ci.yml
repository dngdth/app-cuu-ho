name: Prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rescue_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: rescue_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rescue_test -d rescue_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg2://rescue_test:test_only_password@localhost:5432/rescue_test
      GEOAPIFY_API_KEY: ""
      GEOCODING_ENABLED: "false"
      AUTH_COOKIE_SECURE: "false"
      RESCUE_MODEL_DIR: ai/artifacts/prototype
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.10.2"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python -m pytest test/test_model_report.py test/test_prototype.py test/test_operations.py test/test_processing.py test/test_google_geocoding.py test/test_google_maps.py ai/test/test_run_pipeline.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - run: npm ci
        working-directory: fe
      - run: npm run lint && npm test && npm run build && npm audit --omit=dev
        working-directory: fe
      - run: npx playwright install --with-deps chromium
        working-directory: fe
      - run: uv run python scripts/run_e2e.py
