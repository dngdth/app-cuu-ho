name: app_cuu_ho
services:
  # Frontend with Nginx
  frontend:
    build: ./fe
    container_name: app_cuu_ho_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8098:80"
    depends_on:
      app:
        condition: service_healthy

  # Backend API
  app:
    build: .
    container_name: app_cuu_ho_api_be
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 45s

  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:16-3.4
    container_name: app_cuu_ho_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # pgAdmin
  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:latest
    container_name: app_cuu_ho_pgadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
    depends_on:
      - postgres
